name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/pwabuilder-cli

      - name: Generate Android Package
        run: |
          pwabuilder package --webManifestUrl https://raw.githubusercontent.com/laksir614-a11y/phone-checker/main/manifest.json --platforms android --options '{"name": "PhoneChecker", "shortName": "PhoneChecker", "packageId": "com.laksir.phonechecker", "version": "1.0.0", "launcher": "any"}' || true
          mkdir -p output_apk
          find . -name "*.apk" -exec cp {} output_apk/ \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneChecker-APK
          path: output_apk/
