name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Extract project zip
      run: |
        unzip Phone_Checker_Pro_V1.zip -d extracted_files

    - name: Build APK using Cordova/Bubblewrap or WebAPK
      run: |
        echo "Project files extracted successfully."
