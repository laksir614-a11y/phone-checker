name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract project zip
      run: |
        unzip Phone_Checker_Pro_V1.zip -d extracted_files

    - name: Create WebAPK / Debug APK structure
      run: |
        mkdir -p output_apk
        cp -r extracted_files/* output_apk/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhoneChecker-APK
        path: output_apk/
